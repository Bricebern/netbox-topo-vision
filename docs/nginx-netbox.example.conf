# ─────────────────────────────────────────────────────────────
# NetBox + NetBox Topo Vision — NGINX reverse proxy
#
# netbox.url.fr/           → NetBox       (port 8000)
# netbox.url.fr/topologie/ → Topo Vision  (port 8090)
#
# Remplace <Réseau privé> par ton CIDR (ex: 10.0.0.0/8)
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name netbox.url.fr;
    client_max_body_size 20M;

    # ── Fichiers statiques de Topo Vision ────────────────────
    location = /default-topo.json {
        allow <Réseau privé>;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8090/default-topo.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /favicon.ico {
        proxy_pass http://127.0.0.1:8090/favicon.ico;
    }

    # ── API NetBox via proxy Topo Vision ─────────────────────
    # Le navigateur appelle /api/netbox/xxx
    # NGINX réécrit → /api/xxx → NetBox:8000
    # Le token est injecté côté serveur par le container Topo Vision
    location /api/netbox/ {
        allow <Réseau privé>;
        allow 127.0.0.1;
        deny all;
        rewrite ^/api/netbox/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Topo Vision — interface web ───────────────────────────
    location /topologie/ {
        allow <Réseau privé>;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /topologie {
        return 301 /topologie/;
    }

    # ── NetBox principal ──────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}