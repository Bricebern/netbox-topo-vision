# ─────────────────────────────────────────────────────────────
# NetBox Topo Vision — NGINX reverse-proxy + static server
#
# This file is mounted (or COPYed) as a TEMPLATE
# (/etc/nginx/templates/default.conf.template) — the nginx:alpine
# entrypoint runs envsubst on it at container start so that
# ${NETBOX_URL} and ${NETBOX_TOKEN} are expanded from environment
# variables. See NGINX_ENVSUBST_FILTER in docker-compose.yml.
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # ── No cache for runtime config files ────────────────────
    location ~* \.(env|json)$ {
        add_header Cache-Control "no-store, no-cache";
        root /usr/share/nginx/html;
    }

    # ── Static assets ────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        gzip on;
        gzip_types text/html text/css application/javascript image/svg+xml;
    }

    # ── NetBox API reverse proxy ─────────────────────────────
    # Browser calls   /api/netbox/dcim/devices/
    # NGINX rewrites  → ${NETBOX_URL}/api/dcim/devices/
    # NETBOX_TOKEN is injected as Authorization header, never leaks
    # to the client.
    location /api/netbox/ {
        rewrite ^/api/netbox/(.*)$ /api/$1 break;
        proxy_pass ${NETBOX_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Authorization "Token ${NETBOX_TOKEN}";
        proxy_set_header Accept "application/json";
        proxy_set_header Content-Type "application/json";
        proxy_ssl_server_name on;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # CORS (mostly useful when the browser is on a different origin)
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin   "*" always;
        add_header Access-Control-Allow-Methods  "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers  "Authorization, Content-Type" always;
    }

    # ── Lightweight runtime config (optional) ────────────────
    # Lets ops inject a default-config.json into the container
    # (e.g. via a ConfigMap in K8s) that the front-end can
    # fetch on first load before falling back to localStorage.
    location = /default-config.json {
        root /usr/share/nginx/html;
        default_type application/json;
        try_files /default-config.json =204;
    }

    # ── Health endpoint ──────────────────────────────────────
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
